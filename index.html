<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1613" />

    <title>Tandooriwala Bhadrak — Tandoori, Kebabs, Curries &amp; Biryani in Bhadrak</title>
    <meta
      name="description"
      content="Tandooriwala Bhadrak serves North Indian, Mughlai, Punjabi and Indo-Chinese food from a clay tandoor in Mathasahi, Bhadrak. Browse the menu, get directions or call ahead."
    />
    <!--
      {{SITE_ORIGIN}} is filled in by the server from TRUSTED_ORIGIN, so the share preview a
      crawler reads before any JavaScript has the real deployed domain and never a localhost
      one. Unset (plain `npm start`), these stay relative exactly as a local page needs.
      Per-route titles, canonical URLs and images are then updated at runtime by Seo.tsx.
    -->
    <link rel="canonical" href="{{SITE_ORIGIN}}/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Tandooriwala Bhadrak" />
    <meta property="og:title" content="Tandooriwala Bhadrak — Smoke, Spice &amp; Slow Fire" />
    <meta
      property="og:description"
      content="North Indian, Mughlai, Punjabi and Indo-Chinese cooking from a clay tandoor in Mathasahi, Bhadrak."
    />
    <meta property="og:url" content="{{SITE_ORIGIN}}/" />
    <meta property="og:image" content="{{SITE_ORIGIN}}/images/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandooriwala Bhadrak" />
    <meta
      name="twitter:description"
      content="Tandoori starters, kebabs, curries, biryani and Indo-Chinese plates in Bhadrak."
    />
    <meta name="twitter:image" content="{{SITE_ORIGIN}}/images/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500..700&family=Inter:wght@400..700&family=Shrikhand&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Tandooriwala Bhadrak — Khata 776/4131, Plot 1795/2671, Mathasahi, Bhadrak. Call +91 89173 92926.
      This site needs JavaScript for the full menu experience.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
