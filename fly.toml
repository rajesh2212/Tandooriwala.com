# fly.toml — the deployment this repo is set up for.
#
# Four commands publish it, all of them yours to run (see DEPLOYING.md):
#
#   fly launch --region sin --copy-config --no-deploy --ha=false   # --copy-config keeps this file
#   fly volumes create tandooriwala_data --size 1 --region sin -y
#   fly secrets set NODE_ENV=production TRUSTED_ORIGIN=... TANDOORIWALA_ADMIN_KEY=... --stage
#   fly deploy
#
# The exact flag-by-flag walkthrough, and the two things that will bite, are in DEPLOYING.md §7A.
#
# Why Fly.io: it gives a real Docker container, a persistent volume for the SQLite file and
# the photos, automatic HTTPS with a certificate that renews itself, and a region with capacity
# near India — Singapore (`sin`) is the closest Fly still sells, since Mumbai (`bom1`) was closed
# to new deployments. Customers in Odisha still reach it in tens of milliseconds, and the link
# preview a friend in another country opens is served from the edge, not from your laptop.

app = "tandooriwala-bhadrak"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly does NOT inject PORT — verified on a live machine, where it came back unset and the app
  # sat on its own 8787 while the proxy health-checked 8080. So the port is stated here, and it
  # must match `internal_port` below. TRUSTED_ORIGIN and the admin key come from `fly secrets`,
  # not from here.
  PORT = "8080"
  DATA_FILE = "/data/enquiries.db"
  UPLOAD_DIR = "/data/uploads/avatars"
  TRUST_PROXY_HOPS = "1"
  RESTAURANT_TIMEZONE = "Asia/Kolkata"
  RESTAURANT_UTC_OFFSET = "+05:30"

[mounts]
  source = "tandooriwala_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  processes = ["app"]
  # Fly's own proxy terminates TLS and forwards X-Forwarded-Proto, which is what turns the
  # session cookie's Secure flag on.
  internal_port = 8080

  [services.concurrency]
    hard_limit = 64
    soft_limit = 48

  [[services.ports]]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/api/health"
    # Plain http on purpose: Fly's proxy terminates TLS at the edge, so inside the machine this port
    # only ever speaks HTTP. Asking for https here makes the probe do a TLS handshake against a
    # non-TLS listener — the tcp check passes, the app is fine, but the deployment never goes
    # healthy. Found on the first real deploy.
    protocol = "http"
    # 503 from /api/health means the process is up but cannot open its store.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
